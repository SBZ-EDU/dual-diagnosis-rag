name: Deploy Cloudflare Worker

# دیپلوی ورکر کلودفلر (سایت + API چت + پایگاه داده D1)
# پیش‌نیاز: در Settings → Secrets → Actions مقدار CLOUDFLARE_API_TOKEN را اضافه کنید
# (توکن با دسترسی‌های Workers Scripts:Edit، D1:Edit، Vectorize:Edit، Workers AI:Edit)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["cloudflare/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Deploy worker
        working-directory: cloudflare
        run: |
          npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Health check after deploy
        run: |
          sleep 5
          curl -s --max-time 30 "https://dual-diagnosis-clinical-hub.elasa2next.workers.dev/api/health" | head -c 600 || echo "(health endpoint unavailable)"
