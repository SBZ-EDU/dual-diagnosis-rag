name = "dual-diagnosis-clinical-hub"
main = "src/index.js"
compatibility_date = "2026-08-06"
account_id = "5b456a2b43bb367410c50b35b9e7f71f"

[triggers]
crons = ["17 3 * * 1"]

[vars]
# مدل پاسخ‌گویی — قابل‌تعویض بدون تغییر کد. گزینه‌های چندزبانه‌ی قوی‌تر:
#   "@cf/zai-org/glm-4.7-flash" (چندزبانه، سریع) · "@cf/qwen/qwen3.8-27b"
#   (شناسه‌ی دقیق را با `npx wrangler ai models` چک کنید)
AI_CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
HF_MODEL = "meta-llama/Llama-3.1-8B-Instruct"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "dual-diagnosis-rag-db"
database_id = "adc5372f-1bb1-4833-81f2-524ee8efc369"

[[d1_databases]]
binding = "GUIDELINES_DB"
database_name = "dual-diagnosis-guidelines-db"
database_id = "abe8bb78-c90e-4273-be4d-eadf72dc10cc"  # بازسازی‌شده ۱۴۰۵/۰۶/۰۹ — قبلی حذف شده بود

# جست‌وجوی معنایی (Vectorize + bge-m3 چندزبانه)
# ساخت ایندکس (یک‌بار): npx wrangler vectorize create ddx-semantic --dimensions 1024 --metric cosine
[[vectorize]]
binding = "VEC"
index_name = "ddx-semantic"
